<style>
  *{box-sizing:border-box;margin:0}
  body{width:1200px;height:630px;background:#f8fafc;color:#0f172a;font-family:Inter,system-ui,sans-serif;padding:64px 72px 56px;display:flex;flex-direction:column;position:relative;overflow:hidden}

  .wm{font-weight:800;letter-spacing:.06em;font-size:30px;display:flex;gap:14px;align-items:baseline}

  .wm .sub{font-weight:600;letter-spacing:0;color:#475569}

  li{background:#fff;border:2px solid #dbe2ea;border-radius:16px;padding:22px 24px;border-top:6px solid #4338ca}

  .foot{display:flex;justify-content:space-between;margin-top:30px;font-size:22px;color:#475569;font-weight:600}
  .foot b{color:#4338ca}
